name: Build Dama C++ WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Find C++ sources
        run: find . -type f \( -name '*.cpp' -o -name '*.hpp' \)
      - name: Check WebAssembly build script
        run: |
          if [ -f build-web.sh ]; then
            bash build-web.sh
          else
            echo 'Missing build-web.sh: C++ WebAssembly build not configured'
            exit 1
          fi
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: dama15-web
          path: dist/
